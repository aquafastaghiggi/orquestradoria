name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows: é onde o sistema roda (caminhos, .cmd do Claude/Codex, Git para Windows).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Identidade do Git para os testes
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Chromium (testes de QA no navegador e teste de fumaça)
        run: pnpm --filter @orchestrator/adapters exec playwright install chromium
      - name: Testes da API
        shell: pwsh
        run: |
          pnpm --filter @orchestrator/api test *>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          $text = Get-Content test.log -Raw
          # Publica cada teste que falhou como anotação (legível na página da execução e pela API pública).
          $matches = [regex]::Matches($text, '(?ms)^\s*not ok \d+ - (?<name>[^\r\n]+)\r?\n(?<body>.*?)(?=^\s*(?:ok|not ok) \d+ - |\z)')
          foreach ($m in ($matches | Select-Object -First 12)) {
            $err = [regex]::Match($m.Groups['body'].Value, '(?ms)(error|message): (?<e>.{0,600}?)(?=\r?\n\s+(?:code|name|stack|expected|actual|operator|at|\.\.\.)|\z)')
            $detail = ($err.Groups['e'].Value -replace '\s+', ' ').Trim()
            Write-Host "::error title=Teste falhou::$($m.Groups['name'].Value) :: $detail"
          }
          Get-Content test.log | Select-String -Pattern '^# (tests|pass|fail)' | ForEach-Object { Write-Host $_.Line }
          exit $code
      - run: pnpm --filter @orchestrator/web build
      - name: Teste de fumaça da interface (mock, custo zero)
        run: pnpm smoke
